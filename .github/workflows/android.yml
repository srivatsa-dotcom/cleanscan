# Builds the Android app on every push that touches it and publishes the APK as the
# "android-latest" release:
#   https://github.com/srivatsa-dotcom/cleanscan/releases/tag/android-latest
# On failure the Gradle log is pushed to the `ci-logs` branch (build.log) for debugging.
name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
          exit ${PIPESTATUS[0]}

      - name: Publish APK as release "android-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CleanScan-debug.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest CleanScan-debug.apk \
            --prerelease \
            --title "CleanScan Android - latest test build" \
            --notes "Debug build of ${GITHUB_SHA::7}. Download CleanScan-debug.apk on an ARCore Depth phone, allow installing unknown apps, and open it. See the README for how to process scans."

      - name: Save build log to the ci-logs branch
        if: failure()
        run: |
          cp build.log /tmp/build.log || echo "no build log" > /tmp/build.log
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "Android build log for ${GITHUB_SHA::7}"
          git push --force origin ci-logs
