# Builds the Sideloader CLI (https://github.com/Dadoum/Sideloader, GPL-3.0) for x86_64 Linux,
# because its upstream CI currently only publishes an aarch64 Linux build. Used to install the
# unsigned CleanScan .ipa on an iPhone from Ubuntu - see README "iPhone app".
# The binary is published as the "sideloader-linux" release of this repository.
name: Sideloader for Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/sideloader.yml"]

permissions:
  contents: write

env:
  SIDELOADER_COMMIT: ed89e287ec64d39f09cacc1d1903b8a5af074201  # upstream "Fix #129", 2026-09-18

jobs:
  build:
    runs-on: ubuntu-22.04  # oldest supported glibc, so it runs on Ubuntu 22.04 and newer
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Dadoum/Sideloader
          ref: ${{ env.SIDELOADER_COMMIT }}
          submodules: recursive

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libz-dev elfutils

      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-1.34.0  # the version upstream builds with

      - name: Write version file
        uses: ./.github/actions/write-version-file

      - name: Build CLI
        run: |
          dub build -b release-debug --compiler=ldc2 --arch x86_64-linux-gnu :cli-frontend
          mv bin/sideloader sideloader-linux-x86_64
          eu-strip --strip-debug sideloader-linux-x86_64
          ./sideloader-linux-x86_64 version || true

      - name: Publish release "sideloader-linux"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete sideloader-linux --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create sideloader-linux sideloader-linux-x86_64 -R "$GITHUB_REPOSITORY" \
            --target "${{ github.event.repository.default_branch }}" --prerelease \
            --title "Sideloader CLI for Linux x86_64 (helper)" \
            --notes "Sideloader CLI built from https://github.com/Dadoum/Sideloader/tree/${SIDELOADER_COMMIT} (GPL-3.0; source at that link). Used to install CleanScan on an iPhone from Linux, see the README."
