# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: CleanScan
options:
  bundleIdPrefix: com.cleanscan
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""  # set your Apple team id
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CleanScan:
    type: application
    platform: iOS
    sources:
      - path: CleanScan
      # Optional people/animal model: python tools/export_models.py -> Models/LivingSeg.mlpackage
      # (Xcode compiles it to LivingSeg.mlmodelc inside the app bundle)
      - path: Models
        optional: true
    info:
      path: CleanScan/Info.plist
      properties:
        CFBundleDisplayName: CleanScan
        NSCameraUsageDescription: CleanScan uses the camera and LiDAR to scan your environment.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arkit]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanscan.app
        INFOPLIST_FILE: CleanScan/Info.plist
