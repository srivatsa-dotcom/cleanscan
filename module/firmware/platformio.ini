; CleanScan depth module firmware (ESP32-S3 + MaixSense A010). See ../README.md.
;   pio run -t upload          build and flash over USB
;   pio device monitor         log output (115200)
;   pio test -e native         protocol unit tests on your computer
; Wi-Fi password at build time:  PLATFORMIO_BUILD_FLAGS='-DCLEANSCAN_AP_PASSWORD=\"mysecret1\"' pio run -t upload

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = espidf          ; ESP-IDF (Apache-2.0); the Arduino core is LGPL-2.1
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

; XIAO ESP32S3 (smaller, fits the clip better): pio run -e xiao_esp32s3 -t upload
[env:xiao_esp32s3]
extends = env:esp32s3
board = seeed_xiao_esp32s3
build_flags = ${env:esp32s3.build_flags} -DCLEANSCAN_A010_TX=43 -DCLEANSCAN_A010_RX=44

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
