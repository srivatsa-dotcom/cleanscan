[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanscan-rig"
version = "0.1.0"
description = "Raspberry Pi bridge that streams a LiDAR to the CleanScan app"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cleanscan-rig = "cleanscan_rig.bridge:main"
cleanscan-rig-monitor = "cleanscan_rig.monitor:main"

[tool.setuptools.packages.find]
include = ["cleanscan_rig*"]
